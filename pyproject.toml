[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lahmajo"
version = "0.1.0"
description = "Agentic RAG (Retrieval-Augmented Generation) system with hybrid BM25 + vector search"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dynamic = ["dependencies"]

[project.optional-dependencies]
# sentence-transformers pulls in torch, which is large - kept out of the base install
# (requirements.txt) so CI and the Docker image stay small. Only needed for
# RERANK_PROVIDER=cross_encoder.
cross-encoder = ["sentence-transformers>=3.0"]

[project.scripts]
lahmajo = "lahmajo.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
