<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lahmajo</title>
    <!-- Tailwind via the play CDN: this page is served as a static string by GET /
         (see api/routes.py), so there is no build step and no frontend toolchain. -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-neutral-900 antialiased">
    <div class="mx-auto max-w-3xl px-6 py-12">

        <header class="border-b border-neutral-200 pb-6 mb-10">
            <h1 class="text-2xl font-semibold tracking-tight">lahmajo</h1>
        </header>

        <!-- Ask -->
        <section class="mb-14">
            <h2 class="text-xs font-semibold uppercase tracking-widest text-neutral-500 mb-4">Ask</h2>

            <label for="question" class="block text-sm text-neutral-600 mb-2">Question</label>
            <input type="text" id="question" placeholder="Ask something about the ingested documents"
                   class="w-full border border-neutral-300 px-3 py-2 text-sm placeholder-neutral-400 focus:border-neutral-900 focus:outline-none">

            <fieldset class="mt-5">
                <legend class="text-sm text-neutral-600 mb-2">Retrieval options</legend>
                <div class="flex flex-col gap-2 sm:flex-row sm:gap-8">
                    <label class="flex cursor-pointer items-start gap-2">
                        <input type="checkbox" id="useHybrid" checked
                               class="mt-1 h-4 w-4 shrink-0 accent-neutral-900">
                        <span class="text-sm">
                            Hybrid search
                            <span class="block text-xs text-neutral-500">BM25 + vector (unchecked = vector-only)</span>
                        </span>
                    </label>
                    <label class="flex cursor-pointer items-start gap-2">
                        <input type="checkbox" id="useRerank"
                               class="mt-1 h-4 w-4 shrink-0 accent-neutral-900">
                        <span class="text-sm">
                            Rerank results
                            <span class="block text-xs text-neutral-500">Re-scores retrieved chunks before answering</span>
                        </span>
                    </label>
                </div>
            </fieldset>

            <button id="askBtn" onclick="askQuestion()"
                    class="mt-5 inline-flex items-center gap-2 border border-neutral-900 bg-neutral-900 px-4 py-2 text-sm text-white hover:bg-neutral-700 disabled:cursor-not-allowed disabled:opacity-50">
                Ask
            </button>
            <p id="askStatus" class="mt-3 text-sm"></p>

            <div class="mt-6">
                <label for="answer" class="block text-sm text-neutral-600 mb-2">Answer</label>
                <div id="answer"
                     class="min-h-24 whitespace-pre-wrap break-words border border-neutral-200 bg-neutral-50 p-4 text-sm"></div>
                <div id="sourcesList" class="mt-4"></div>
            </div>
        </section>

        <!-- Ingested documents -->
        <section class="mb-14">
            <h2 class="text-xs font-semibold uppercase tracking-widest text-neutral-500 mb-4">Ingested documents</h2>
            <div id="documentsList" class="text-sm">
                <p class="text-neutral-500">Loading documents...</p>
            </div>
        </section>

        <!-- Ingest -->
        <section>
            <h2 class="text-xs font-semibold uppercase tracking-widest text-neutral-500 mb-4">Ingest</h2>

            <label for="url" class="block text-sm text-neutral-600 mb-2">URL (optional)</label>
            <input type="text" id="url" placeholder="https://example.com/article"
                   class="w-full border border-neutral-300 px-3 py-2 text-sm placeholder-neutral-400 focus:border-neutral-900 focus:outline-none">

            <label for="files" class="mt-5 block text-sm text-neutral-600 mb-2">Files (TXT, PDF, MD)</label>
            <input type="file" id="files" multiple accept=".txt,.pdf,.md"
                   class="block w-full text-sm text-neutral-600 file:mr-3 file:border file:border-neutral-300 file:bg-white file:px-3 file:py-1.5 file:text-sm file:text-neutral-900 hover:file:bg-neutral-100">
            <div id="fileList" class="mt-2 text-xs text-neutral-500"></div>

            <fieldset class="mt-5">
                <legend class="text-sm text-neutral-600 mb-2">Chunking strategy</legend>
                <div class="flex flex-col gap-2 sm:flex-row sm:gap-8">
                    <label class="flex cursor-pointer items-start gap-2">
                        <input type="radio" name="chunking" value="recursive" checked
                               class="mt-1 h-4 w-4 shrink-0 accent-neutral-900">
                        <span class="text-sm">
                            Recursive
                            <span class="block text-xs text-neutral-500">Consistent chunks, preserves structure. For CVs and structured docs.</span>
                        </span>
                    </label>
                    <label class="flex cursor-pointer items-start gap-2">
                        <input type="radio" name="chunking" value="semantic"
                               class="mt-1 h-4 w-4 shrink-0 accent-neutral-900">
                        <span class="text-sm">
                            Semantic
                            <span class="block text-xs text-neutral-500">Chunks by meaning, can be unpredictable. For articles.</span>
                        </span>
                    </label>
                </div>
            </fieldset>

            <button id="ingestBtn" onclick="ingestDocuments()"
                    class="mt-5 inline-flex items-center gap-2 border border-neutral-900 px-4 py-2 text-sm text-neutral-900 hover:bg-neutral-100 disabled:cursor-not-allowed disabled:opacity-50">
                Ingest
            </button>
            <p id="ingestStatus" class="mt-3 text-sm"></p>
        </section>
    </div>

    <script>
        // Status tone. The palette is otherwise monochrome; colour is reserved for
        // telling an error apart from a success at a glance.
        const STATUS_TONE = {
            success: 'text-neutral-600',
            error: 'text-red-700'
        };

        const SPINNER = '<span class="inline-block h-3 w-3 animate-spin rounded-full border border-current border-t-transparent"></span>';

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load and display ingested documents
        async function loadDocuments() {
            const documentsList = document.getElementById('documentsList');
            try {
                const response = await fetch('/documents');
                if (!response.ok) {
                    throw new Error('Failed to load documents');
                }
                const data = await response.json();

                if (data.total_documents === 0) {
                    documentsList.innerHTML = '<p class="text-neutral-500">No documents ingested yet.</p>';
                    return;
                }

                documentsList.innerHTML = data.documents.map(doc => `
                    <div class="mb-6 border-l-2 border-neutral-300 pl-4">
                        <h3 class="font-medium">${escapeHtml(doc.source)}</h3>
                        <p class="mt-1 text-xs text-neutral-500">
                            ${doc.total_chunks} chunk${doc.total_chunks !== 1 ? 's' : ''}
                            &middot; ${doc.total_chars.toLocaleString()} characters
                        </p>
                        <div class="mt-3 max-h-64 overflow-y-auto">
                            ${doc.chunks.map((chunk, idx) => `
                                <div class="mb-2 border border-neutral-200 bg-neutral-50 p-2">
                                    <div class="flex justify-between text-xs text-neutral-500">
                                        <span>Chunk ${idx + 1}</span>
                                        <span>${chunk.length.toLocaleString()} chars</span>
                                    </div>
                                    <p class="mt-1 whitespace-pre-wrap break-words text-xs text-neutral-700">${escapeHtml(chunk.preview)}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                documentsList.innerHTML = `<p class="text-red-700">Error loading documents: ${escapeHtml(error.message)}</p>`;
            }
        }

        // Render the excerpts behind an answer. The numbering matches the
        // [source N] markers the model cites inline, so a reader can follow a
        // citation to the file and text it came from.
        function renderSources(sources) {
            const container = document.getElementById('sourcesList');

            if (!sources || sources.length === 0) {
                container.innerHTML = '';
                return;
            }

            const items = sources.map(source => {
                // Score is provider-specific and only comparable within one
                // retrieval call - an answer built from two calls carries two
                // unrelated scales - so it is shown as a raw number, never as a
                // percentage or a bar that would invite comparing across items.
                const score = (source.score === null || source.score === undefined)
                    ? ''
                    : ' &middot; score ' + Number(source.score).toFixed(4);
                return `
                    <div class="mb-2 border-l-2 border-neutral-300 bg-neutral-50 px-3 py-2">
                        <div class="flex justify-between gap-3 text-xs">
                            <span class="font-medium text-neutral-700">[source ${source.index}] ${escapeHtml(source.source)}</span>
                            <span class="whitespace-nowrap text-neutral-500">${source.length} chars${score}</span>
                        </div>
                        <p class="mt-1 whitespace-pre-wrap break-words text-xs text-neutral-600">${escapeHtml(source.preview)}</p>
                    </div>
                `;
            }).join('');

            container.innerHTML =
                '<h3 class="mb-2 text-xs font-semibold uppercase tracking-widest text-neutral-500">Sources</h3>' + items;
        }

        // Ask question
        async function askQuestion() {
            const question = document.getElementById('question').value.trim();
            const answerArea = document.getElementById('answer');
            const askBtn = document.getElementById('askBtn');

            if (!question) {
                showStatus('askStatus', 'Please enter a question', 'error');
                return;
            }

            const useHybrid = document.getElementById('useHybrid').checked;
            const useRerank = document.getElementById('useRerank').checked;

            askBtn.disabled = true;
            askBtn.innerHTML = SPINNER + 'Asking...';
            answerArea.textContent = '';
            renderSources([]);
            clearStatus('askStatus');

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question: question, use_hybrid: useHybrid, use_rerank: useRerank })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to get answer');
                }

                const data = await response.json();
                answerArea.textContent = data.answer;
                renderSources(data.sources || []);
                showStatus('askStatus', 'Answered.', 'success');
            } catch (error) {
                showStatus('askStatus', 'Error: ' + error.message, 'error');
                answerArea.textContent = 'Error: ' + error.message;
                renderSources([]);
            } finally {
                askBtn.disabled = false;
                askBtn.textContent = 'Ask';
            }
        }

        // Ingest documents
        async function ingestDocuments() {
            const url = document.getElementById('url').value.trim();
            const files = document.getElementById('files').files;
            const ingestBtn = document.getElementById('ingestBtn');

            const chunkingStrategy = document.querySelector('input[name="chunking"]:checked').value;

            if (!url && files.length === 0) {
                showStatus('ingestStatus', 'Please provide a URL or upload at least one file', 'error');
                return;
            }

            ingestBtn.disabled = true;
            ingestBtn.innerHTML = SPINNER + 'Ingesting...';
            clearStatus('ingestStatus');

            try {
                const formData = new FormData();
                if (url) {
                    formData.append('url', url);
                }
                for (let i = 0; i < files.length; i++) {
                    formData.append('files', files[i]);
                }
                formData.append('chunking_strategy', chunkingStrategy);

                const response = await fetch('/ingest', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to ingest documents');
                }

                const data = await response.json();
                const strategyName = chunkingStrategy === 'recursive' ? 'Recursive' : 'Semantic';
                showStatus('ingestStatus',
                    `${data.message || `Successfully ingested ${data.chunks_added} chunks`} (${strategyName} chunking)`,
                    'success');

                // Clear form
                document.getElementById('url').value = '';
                document.getElementById('files').value = '';
                document.getElementById('fileList').textContent = '';

                // Reload documents list
                loadDocuments();
            } catch (error) {
                showStatus('ingestStatus', 'Error: ' + error.message, 'error');
            } finally {
                ingestBtn.disabled = false;
                ingestBtn.textContent = 'Ingest';
            }
        }

        function showStatus(elementId, message, type) {
            const status = document.getElementById(elementId);
            status.textContent = message;
            status.className = `mt-3 text-sm ${STATUS_TONE[type] || 'text-neutral-600'}`;
            setTimeout(() => clearStatus(elementId), 5000);
        }

        function clearStatus(elementId) {
            const status = document.getElementById(elementId);
            status.textContent = '';
            status.className = 'mt-3 text-sm';
        }

        // Show selected file names
        document.getElementById('files').addEventListener('change', function(e) {
            const fileList = document.getElementById('fileList');
            fileList.textContent = e.target.files.length > 0
                ? 'Selected: ' + Array.from(e.target.files).map(f => f.name).join(', ')
                : '';
        });

        // Allow Enter key to submit question
        document.getElementById('question').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                askQuestion();
            }
        });

        loadDocuments();
    </script>
</body>
</html>
